name: CI

# Exécute la suite de tests (app/scripts/test-*.js via `npm test`) à chaque push
# sur main et sur chaque pull request. Couvre la partie JS ; le RENDU réel du PPT
# (Chrome/PowerPoint, relecture à l'œil) n'est pas testable en CI et reste vérifié
# manuellement (voir docs/wiki/technical/tests.md). En revanche, les vérifications
# géométrie et charte graphique du générateur — python-pptx pur, aucun rendu
# visuel réel — tournent bien ici : test-export-ppt.py (via `npm test` →
# test-export-ppt-si-dispo.js, qui skip proprement sans python-pptx) et
# test-ppt-charte.py (étape dédiée ci-dessous, absent de `npm test`).

# Jeton du workflow reduit a la lecture du contenu : ce workflow ne publie rien.
# Sans ce bloc, GITHUB_TOKEN herite du defaut du depot, qui peut etre en
# ecriture (audit securite du 2026-09-19, ASI09).
permissions:
  contents: read

# Actions EPINGLEES PAR SHA (audit securite 2026-09-19, ASI09 supply chain) :
# un tag mouvant comme `@v4` est repointable par l'upstream (ou par un
# compromis de compte) sans que rien ne change ici. Le commentaire `# v4` dit
# quelle version l'empreinte represente ; pour mettre a jour, resoudre le tag
# (`gh api repos/<action>/git/ref/tags/<tag> --jq .object.sha`) et remplacer
# l'empreinte, jamais revenir au tag nu.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # package-lock.json EST versionné (app/package-lock.json) → `npm ci`
      # (déterministe, plus rapide, échoue si le lockfile diverge de
      # package.json — comportement voulu en CI).
      - name: Install dependencies
        run: npm ci

      - name: Setup Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # python-pptx seul (pas de Chrome/PowerPoint) : suffit à faire tourner
      # réellement test-export-ppt.py (géométrie, via test-export-ppt-si-dispo.js
      # dans `npm test`, sinon SKIP faute de python-pptx) et test-ppt-charte.py
      # (charte graphique, étape dédiée plus bas) — les deux inspectent le modèle
      # objet python-pptx, sans jamais produire de rendu visuel réel.
      - name: Install python-pptx
        run: pip install python-pptx

      - name: Lint
        run: npm run lint

      # Couverture affichée (c8), sans seuil imposé : on mesure d'abord
      # (constat superviseur flotte 2026-07-23 — aucun projet ne mesurait
      # ce que ses tests couvrent). Gate éventuel plus tard.
      # Inclut désormais test-export-ppt.py pour de vrai (python-pptx installé
      # ci-dessus), plus l'exécution SKIP sur postes non outillés.
      - name: Run tests (with coverage)
        run: npm run test:cov

      # Charte graphique du PPT (police/couleurs/contraste/alignement) sur le
      # vrai template OCTO — non branché dans `npm test` (app/README.md), ajouté
      # ici en étape dédiée : ne nécessite que python-pptx, aucun rendu
      # Chrome/PowerPoint réel (cf. docstring du script).
      - name: PPT — charte graphique (python-pptx)
        run: python scripts/test-ppt-charte.py
