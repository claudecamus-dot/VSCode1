name: CI

# Exécute la suite de tests (app/scripts/test-*.js via `npm test`) puis les tests de
# bout en bout en NAVIGATEUR RÉEL (app/scripts/e2e-*.js via `npm run test:e2e`, Chrome
# installé par l'étape setup-chrome ci-dessous) à chaque push sur main et sur chaque
# pull request. Le rendu réel du PPT (PowerPoint, relecture à l'œil) n'est, lui, pas
# testable en CI et reste vérifié manuellement (voir docs/wiki/technical/tests.md).
# En revanche, les vérifications
# géométrie et charte graphique du générateur — python-pptx pur, aucun rendu
# visuel réel — tournent bien ici : test-export-ppt.py (via `npm test` →
# test-export-ppt-si-dispo.js, qui skip proprement sans python-pptx) et
# test-ppt-charte.py (via `npm test` → test-ppt-charte-si-dispo.js).

# Jeton du workflow reduit a la lecture du contenu : ce workflow ne publie rien.
# Sans ce bloc, GITHUB_TOKEN herite du defaut du depot, qui peut etre en
# ecriture (audit securite du 2026-09-19, ASI09).
permissions:
  contents: read

# Actions EPINGLEES PAR SHA (audit securite 2026-09-19, ASI09 supply chain) :
# un tag mouvant comme `@v4` est repointable par l'upstream (ou par un
# compromis de compte) sans que rien ne change ici. Le commentaire `# v4` dit
# quelle version l'empreinte represente ; pour mettre a jour, resoudre le tag
# (`gh api repos/<action>/git/ref/tags/<tag> --jq .object.sha`) et remplacer
# l'empreinte, jamais revenir au tag nu.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # package-lock.json EST versionné (app/package-lock.json) → `npm ci`
      # (déterministe, plus rapide, échoue si le lockfile diverge de
      # package.json — comportement voulu en CI).
      - name: Install dependencies
        run: npm ci

      - name: Setup Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # python-pptx seul (pas de PowerPoint) : suffit à faire tourner
      # réellement test-export-ppt.py (géométrie, via test-export-ppt-si-dispo.js
      # dans `npm test`, sinon SKIP faute de python-pptx) et test-ppt-charte.py
      # (charte graphique, via test-ppt-charte-si-dispo.js dans `npm test`) — les deux
      # inspectent le modèle objet python-pptx, sans jamais produire de rendu visuel réel.
      - name: Install python-pptx
        run: pip install -r requirements.txt  # python-pptx==1.0.2 (version épinglée, app/requirements.txt)

      # Chrome installé de façon déterministe (le Chrome préinstallé du runner n'est pas
      # garanti) ; CHROME_PATH fait AUTORITÉ pour app/scripts/navigateur-e2e.js. En CI,
      # l'absence de navigateur est un ÉCHEC (test-entetes-securite.js, e2e-*.js).
      # Épinglé par SHA de COMMIT (v2.2.0, résolu via `gh api`, pas le SHA du tag annoté).
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Exporter CHROME_PATH
        run: echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      # Couverture affichée (c8), sans seuil imposé : on mesure d'abord
      # (constat superviseur flotte 2026-07-23 — aucun projet ne mesurait
      # ce que ses tests couvrent). Gate éventuel plus tard.
      # Inclut test-export-ppt.py ET test-ppt-charte.py pour de vrai (python-pptx
      # installé ci-dessus, via les ponts *-si-dispo.js). En CI (CI=true) un skip
      # faute de python-pptx est un ÉCHEC, jamais un SKIP silencieux.
      - name: Run tests (with coverage)
        run: npm run test:cov

      # Tests de bout en bout en navigateur réel (CHROME_PATH posé ci-dessus ; CI=true
      # rend le navigateur obligatoire). Script `test:e2e` défini dans app/package.json.
      - name: Run e2e tests (Chrome)
        run: npm run test:e2e

      # Audit des dependances (adoption veille SSDF/OWASP du 2026-09-26).
      # NON bloquant au depart (continue-on-error) : on mesure avant de gater,
      # meme logique que la couverture ci-dessus — gate eventuel une fois la
      # mesure stabilisee.
      - name: Audit des dependances (npm audit, informatif)
        continue-on-error: true
        run: npm audit --audit-level=high
