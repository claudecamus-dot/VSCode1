<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
  </head>
  <body>
    <h1>Maturite agile (squelette Apps Script)</h1>
    <p id="etat">Appel de l'action factice...</p>
    <script>
      google.script.run
        .withSuccessHandler(function (r) { document.getElementById('etat').textContent = 'ping ok : ' + r.at; })
        .withFailureHandler(function (e) { document.getElementById('etat').textContent = 'echec : ' + e.message; })
        .ping();
    </script>
  </body>
</html>
